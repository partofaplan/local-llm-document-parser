# Run on any Linux host with Docker (no Kubernetes):
#   docker compose up -d --build                                            # CPU
#   docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml up -d  # NVIDIA GPU
# Then open http://localhost:8080
services:
  ollama:
    image: ollama/ollama:0.34.0
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  api:
    build: .
    image: docparser-api:dev
    ports: ["8080:8080"]
    environment:
      DOCPARSER_OLLAMA_URL: http://ollama:11434
      DOCPARSER_MODEL: ${DOCPARSER_MODEL:-qwen2.5:3b}
    volumes:
      - ./prompts:/app/prompts:ro
    depends_on: [ollama]
    restart: unless-stopped

volumes:
  ollama-models:
