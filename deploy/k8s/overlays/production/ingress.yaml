apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docparser
  annotations:
    # CPU inference can take minutes; raise proxy timeouts for ingress-nginx.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  # ingressClassName: nginx
  rules:
    - host: docparser.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docparser-api
                port: {name: http}
