apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docparser
spec:
  ingressClassName: traefik
  rules:
    - host: docparser.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docparser-api
                port: {name: http}
