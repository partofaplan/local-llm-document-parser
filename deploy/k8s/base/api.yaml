# Contract memory and chat sessions live in SQLite on this volume, so the API runs as a single replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docparser-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docparser-api
  labels:
    app.kubernetes.io/name: docparser-api
spec:
  replicas: 1
  strategy:
    type: Recreate  # the data volume is ReadWriteOnce
  selector:
    matchLabels:
      app.kubernetes.io/name: docparser-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docparser-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: docparser-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:  # let the ingress drop this endpoint before the server stops
              exec:
                command: ["sleep", "5"]
          envFrom:
            - configMapRef:
                name: docparser-config
          # Ready once Ollama is reachable and the model has been pulled.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: prompts
              mountPath: /app/prompts
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: prompts
          configMap:
            name: docparser-prompts
        - name: data
          persistentVolumeClaim:
            claimName: docparser-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docparser-api
  labels:
    app.kubernetes.io/name: docparser-api
spec:
  selector:
    app.kubernetes.io/name: docparser-api
  ports:
    - name: http
      port: 80
      targetPort: http
